<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skittles</title>
    <script>
      // Sets data-theme before first paint: ?theme=light|dark|system (remembered), else dark.
      (() => {
        const root = document.documentElement;
        const media = matchMedia("(prefers-color-scheme: dark)");
        const asked = new URLSearchParams(location.search).get("theme");
        try {
          if (asked === "light" || asked === "dark" || asked === "system") localStorage.setItem("skittles-theme", asked);
        } catch {}
        const apply = () => {
          let pref = "dark";
          try {
            pref = localStorage.getItem("skittles-theme") || "dark";
          } catch {}
          root.dataset.theme = pref === "system" ? (media.matches ? "dark" : "light") : pref;
        };
        apply();
        media.addEventListener("change", apply);
      })();
    </script>
